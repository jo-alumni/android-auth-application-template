# PRとmainへのpushで、ビルド・テスト・静的解析を回す。
#
# ジョブを2つに分けているのは、失敗したときに「壊れたのか」「規約に反したのか」を
# チェック名だけで切り分けられるようにするため。
#
# ドキュメントのみの変更（docs/ や *.md、.claude/ 配下）ではビルド・静的解析ジョブを
# skipする（`changes` ジョブ参照）。トリガー自体を paths-ignore で止めない理由は、
# ワークフローが起動しないとチェックが1件も投稿されず、branch protectionで
# required status checksに設定していた場合にPRが永久にpending扱いになるため。
# ジョブ単位でskipすれば「skipped」として結果が投稿され、required checksとしては
# 合格扱いになる。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けてpushしたら、古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # push/pull_requestどちらでもローカルのgit diffで判定するため、
      # 比較対象のコミットが揃うようfetch-depth: 0でフル履歴を取得する
      # （GitHub REST APIは使わないので、追加の権限は不要）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ドキュメント・Claude Code設定だけの変更かどうかを判定する。
      # .editorconfig はktlintが直接読む設定ファイルなので除外しない。
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'

  build:
    name: build / test / lint
    needs: changes
    # changesジョブ自体が失敗したときは「判定不能」なので、skipではなくフル実行に
    # フェイルセーフする。ここをskipにすると、コードは一切ビルドされていないのに
    # skipped=required checksは合格扱い、という偽陽性のグリーンになってしまう。
    # always()ではなく!cancelled()にしているのは、concurrencyのcancel-in-progressで
    # このワークフロー実行自体がキャンセルされた場合はフェイルセーフより優先して
    # 素直にキャンセルさせるため（always()だとキャンセル後も実行され続けてしまう）。
    if: |
      !cancelled() &&
      (needs.changes.result == 'failure' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 11はモジュールのtoolchain（jvmToolchain(11) / compileOptions）用、
      # 25はGradle Daemon用（gradle/gradle-daemon-jvm.properties で固定されている）。
      # 最後に書いたものがJAVA_HOMEになる。Gradleへの見せ方は gradle.properties の
      # org.gradle.java.installations.fromEnv で指定している。
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            25

      # ANDROID_HOME / ANDROID_SDK_ROOT を設定し、SDKのライセンスに同意させる。
      # local.properties はコミットしていないので、AGPはこの環境変数からSDKを見つける
      # （不足しているplatform/build-toolsはAGPが自動でダウンロードする）。
      # packagesを空にしているのは、既定値の `tools` がSDKリポジトリから廃止済みで、
      # sdkmanagerが "Failed to find package 'tools'" で失敗するため。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # Gradleのキャッシュ（~/.gradle/caches, wrapper, configuration cache）を扱う。
      # mainのビルドだけがキャッシュを書き込み、PRは読み取りのみ。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # assembleReleaseも含めるのは、release専用のR8/keepルール設定(docs/release-build.md)が
      # 壊れてもビルドが通ってしまう(=検知できない)状態に戻さないため。
      - name: Assemble, test, lint
        run: ./gradlew assembleDebug assembleRelease test lint --stacktrace

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore

  static-analysis:
    name: ktlint / detekt
    needs: changes
    # フェイルセーフの理由・!cancelled()を使う理由は build ジョブのコメントを参照。
    if: |
      !cancelled() &&
      (needs.changes.result == 'failure' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            25

      # packagesを空にする理由は build ジョブのコメントを参照。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # spotlessCheckが落ちたら ./gradlew spotlessApply で直せる。
      - name: ktlint (Spotless) / detekt
        run: ./gradlew spotlessCheck detekt --stacktrace

      - name: Upload detekt reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          retention-days: 7
          if-no-files-found: ignore
