# 全モジュール共通のRobolectric設定。
# 各モジュールの src/test/resources に置く代わりに、authapplication.android.compose
# Convention Plugin が test の resources srcDir としてこのディレクトリを追加している。
#
# Robolectricはマニフェストの targetSdk(=compileSdk 37)でAndroidを起動しようとするが、
# 4.16.1が対応するSDKは36までのため、明示的に固定する。
# Robolectricを更新して37に対応したら、この値を上げるか行ごと削除してよい。
sdk=36
